name: CI

# Docs-only changes skip this workflow (docs.yml builds those). If a check from
# here ever becomes required, switch to per-job filtering: a skipped workflow
# leaves a required check pending forever.
on:
  push:
    branches: [main]
    paths-ignore: &no-code
      - 'docs/**'
      - '**.md'
      - 'assets/**'
      - LICENSE
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore: *no-code

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: gofmt check
        run: test -z "$(gofmt -l .)"
      # Findings show inline on the PR. Keep version in sync with GOLANGCILINT_VERSION in the Makefile.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout 10m
          # shortcut: ~300 older findings would fail every run, so only the PR's
          # (or the push's) changes are checked. Fix them, then drop this.
          only-new-issues: true

  # Security linter for the workflow files themselves (pinning, credentials,
  # injection). Results go to the Security tab.
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod

  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write        # the test report on the PR
      pull-requests: write # the test summary comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: make build

      - name: unit tests (race, coverage, junit)
        run: make test-report

      - name: coverage summary
        if: always()
        run: |
          {
            echo '## Unit test coverage'
            scripts/coverage-summary.sh coverage.out --markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: publish test report
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: always()
        with:
          report_paths: junit.xml
          check_name: unit tests
          detailed_summary: true
          include_passed: false

      # Optional: set CODECOV_TOKEN in the repository secrets to get coverage
      # trends and per-PR diffs on codecov.io. Without it this step is a no-op.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always() && env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: unit
          fail_ci_if_error: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: |
            coverage.out
            junit.xml
            test.json
          retention-days: 14

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install podman
        run: sudo apt-get update -qq && sudo apt-get install -y -qq podman uidmap
      - run: make image VERSION=ci IMAGE=podcd:ci
      - name: smoke test
        run: |
          podman run --rm podcd:ci version
          podman run --rm --entrypoint git podcd:ci --version
          podman run --rm --entrypoint systemctl podcd:ci --version
      - name: run a real command against a mounted repository
        run: podman run --rm -v "$PWD/examples:/home/podcd/examples:ro,Z" podcd:ci lint /home/podcd/examples

  # Rootless podman + systemd --user on a hosted GitHub runner is inherently
  # a bit fragile (lingering, dbus session, XDG_RUNTIME_DIR). This job is
  # best-effort and does not gate merges or releases; tighten it (drop
  # continue-on-error) once it has proven stable.
  e2e:
    runs-on: ubuntu-latest
    needs: build-test
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install podman
        run: sudo apt-get update -qq && sudo apt-get install -y -qq podman uidmap dbus-user-session
      - run: make build
      - run: make test-e2e

  # The docker runtime. Hosted runners have a Docker daemon and Compose v2,
  # so this runs directly; best-effort like the podman job above.
  e2e-docker:
    runs-on: ubuntu-latest
    needs: build-test
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test-e2e-docker
