name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go vet ./...

      - name: gofmt check
        run: test -z "$(gofmt -l .)"

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - run: make build

      - run: make test

  # Rootless podman + systemd --user on a hosted GitHub runner is inherently
  # a bit fragile (lingering, dbus session, XDG_RUNTIME_DIR). This job is
  # best-effort and does not gate merges or releases; tighten it (drop
  # continue-on-error) once it has proven stable.
  e2e:
    runs-on: ubuntu-latest
    needs: build-test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: install podman
        run: sudo apt-get update -qq && sudo apt-get install -y -qq podman uidmap dbus-user-session

      - run: make build

      - run: make test-e2e
