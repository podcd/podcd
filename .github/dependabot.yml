version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    cooldown:
      default-days: 7 # let a bad release get yanked before we take it
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7 # let a bad release get yanked before we take it
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /docs
    cooldown:
      default-days: 7 # let a bad release get yanked before we take it
    schedule:
      interval: monthly
    groups:
      docs:
        patterns: ["*"]
