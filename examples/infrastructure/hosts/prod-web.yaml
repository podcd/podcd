# Two VMs in the same group. They get the same applications without either of
# them being told about the other, and without anything connecting to them.
apiVersion: gitops.podcd.io/v1
kind: Host
metadata:
  name: prod-web-01
spec:
  environment: production
  groups:
    - web
---
apiVersion: gitops.podcd.io/v1
kind: Host
metadata:
  name: prod-web-02
spec:
  environment: production
  groups:
    - web
  # A host can tune what it runs. This one is the canary: it gets debug logging
  # and nothing else in the fleet is affected.
  applications:
    - metrics
  overrides:
    api:
      env:
        LOG_LEVEL: debug
    # A Pod is overridden with a strategic merge patch: containers merge by
    # name, so this touches the shipper and leaves the collector alone.
    metrics:
      spec:
        containers:
          - name: shipper
            env:
              - name: SHIP_VERBOSE
                value: "true"
---
apiVersion: gitops.podcd.io/v1
kind: Host
metadata:
  name: staging-web-01
spec:
  environment: staging
  groups:
    - web
  # Staging does not run the frontend yet.
  excludeApplications:
    - frontend
