# The agent's own configuration. 
# It lives on the VM (~/.config/podcd/agent.yaml or /etc/podcd/agent.yaml), not in Git
# this file is what decides which Git the machine trusts.

# Which Host document this VM is. Omit to use the system hostname.
host: ""

# How often to pull and reconcile, plus jitter so a fleet does not hit Git in
# lockstep.
interval: 60s
jitter: 10s

runtime: podman

# One or more repositories. They are composed into a single desired state;
# a name defined twice across them is an error, not a race.
repositories:
  - name: infrastructure
    url: https://github.com/podcd/podcd-gitops.git
    revision: main
    # Only this subdirectory is read.
    # path: clusters/prod

# Remove applications that Git no longer declares. 
# On by default;
prune: true

# Root for relative `file:` secret references. `env:` references come from the
# agent's own environment (see deploy/podcd-agent.service).
secretsDir: /etc/podcd/secrets

logFormat: text
