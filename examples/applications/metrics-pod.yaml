# A plain Kubernetes Pod. podcd plays it with `podman kube play` through a
# Quadlet .kube unit; nothing about it is podcd-specific except the name it is
# referenced by (metadata.name) and the image-pinning rule.
#
# Both containers are nginx. The collector serves a page mounted from a
# ConfigMap; the shipper listens on a second port with a server block mounted
# from another ConfigMap, the way a real sidecar would carry its own config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-page
data:
  index.html: "metrics collector\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-shipper-conf
data:
  default.conf: |
    server { listen 9201; location / { return 200 "shipper\n"; } }
---
# Secrets in Git carry references, never values. `data:` is refused outright;
# every stringData value is resolved on the host at reconcile time.
apiVersion: v1
kind: Secret
metadata:
  name: metrics-token
stringData:
  PUSH_TOKEN: env:METRICS_PUSH_TOKEN
---
apiVersion: v1
kind: Pod
metadata:
  name: metrics
spec:
  volumes:
    - name: page
      configMap:
        name: metrics-page
    - name: shipper-conf
      configMap:
        name: metrics-shipper-conf
  containers:
    - name: collector
      image: docker.io/library/nginx@sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3
      volumeMounts:
        - name: page
          mountPath: /usr/share/nginx/html
      env:
        - name: PUSH_TOKEN
          valueFrom:
            secretKeyRef:
              name: metrics-token
              key: PUSH_TOKEN
      ports:
        - containerPort: 80
          hostPort: 9200
          hostIP: 127.0.0.1
      # The readiness probe becomes podcd's health check, against the host port.
      readinessProbe:
        httpGet:
          path: /
          port: 80
    - name: shipper
      image: docker.io/library/nginx@sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3
      volumeMounts:
        - name: shipper-conf
          mountPath: /etc/nginx/conf.d
      ports:
        - containerPort: 9201
          hostPort: 9201
          hostIP: 127.0.0.1
