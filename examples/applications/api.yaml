# The base definition of an application. It says what the app *is*, not where
# it runs. Where it runs is decided by groups and hosts.
#
# Every image in these examples is real and pullable, so the examples can be
# pointed at a host and run as they are.
apiVersion: gitops.podcd.io/v1
kind: Application
metadata:
  name: api
spec:
  # Pinned to a digest, so this commit identifies exactly what is deployed.
  # A tag would let the same commit mean two different things next week.
  image: docker.io/library/nginx@sha256:72ba65eb42c10344912a84ff42408db7d34f2feb642204570ab8fc5ffd29f1d3
  ports:
    - host: 8080
      container: 80
      hostIP: 127.0.0.1 # published only to the host; a proxy fronts it
  env:
    APP_ENV: production
    LOG_LEVEL: info
  secretEnv:
    # Resolved on the host from the agent's environment. The value is never in Git.
    DATABASE_PASSWORD: env:API_DATABASE_PASSWORD
  restartPolicy: always
  stopTimeout: 30
  resources:
    memory: 512M
    cpu: 150%
  healthcheck:
    retries: 30
    interval: 2s
    http:
      port: 8080
      path: /
