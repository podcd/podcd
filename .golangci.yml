# golangci-lint v2. `make lint` and CI read this file.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gosec
    - misspell
    - nilerr
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        - G204 # podcd runs podman, docker, git and systemctl by design
        - G304 # podcd reads files from the Git repository it reconciles by design

issues:
  # shortcut: only code changed since origin/main is checked, so ~300 older
  # findings do not block PRs. Fix them, then delete this line.
  new-from-merge-base: origin/main
